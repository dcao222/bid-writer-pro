[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bid-writer-pro"
version = "0.1.0"
description = "投标/标书写作助手：基于模板一键生成规范 Word 标书"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "python-docx>=1.1.0",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bid-writer-pro = "bid_writer_pro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
